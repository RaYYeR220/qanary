[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = false
ffi = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../../vectors" }, { access = "read-write", path = "../../deployments" }]
gas_limit = 1000000000
# The vendored Fireblocks ML-DSA-44 core (lib/evm-ml-dsa-verifier, see src/fallback/README.md) only
# compiles through the IR pipeline; everything else keeps legacy codegen.
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [{ paths = "lib/evm-ml-dsa-verifier/src/MLDSA44Verifier.sol", via_ir = true }]
[lint]
# compiled under the via-IR profile only, so the linter finds no legacy AST for it
ignore = ["src/fallback/MLDSA44Core.sol"]
[fuzz]
runs = 1000
[invariant]
runs = 256
depth = 64
[rpc_endpoints]
arb_one = "${ARB_ONE_RPC}"
arb_sepolia = "${ARB_SEPOLIA_RPC}"
